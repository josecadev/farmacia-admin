<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login Sistema Farmacéutico Wireframe</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#19e65e",
              "background-light": "#f6f8f6",
              "background-dark": "#112116",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#333333]">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="flex flex-1 justify-center items-center py-5 px-4">
<div class="layout-content-container flex flex-col max-w-md w-full flex-1">
<div class="flex justify-center mb-8">
<div class="w-48 h-16 border-2 border-dashed border-[#333333] flex items-center justify-center">
<p class="text-[#333333] text-lg font-medium">Logo</p>
</div>
</div>
<div class="flex justify-center mb-6">
<p class="text-[#333333] text-4xl font-black leading-tight tracking-[-0.033em]">Acceso al Sistema</p>
</div>
<div class="w-full space-y-4">
<div class="flex flex-col gap-1">
<p class="text-[#333333] text-base font-medium leading-normal">Usuario o correo</p>
<div class="w-full h-14 border-2 border-[#333333] rounded"></div>
</div>
<div class="flex flex-col gap-1">
<p class="text-[#333333] text-base font-medium leading-normal">Contraseña</p>
<div class="w-full h-14 border-2 border-[#333333] rounded"></div>
</div>
<div class="flex justify-center pt-2">
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded h-12 bg-transparent text-[#333333] text-base font-bold leading-normal tracking-[0.015em] border-2 border-[#333333]">
<span class="truncate">Iniciar sesión</span>
</button>
</div>
</div>
<div class="flex justify-center mt-4">
<a class="text-[#333333] text-sm underline" href="#">¿Olvidaste la contraseña?</a>
</div>
<div class="flex justify-center mt-8">
<p class="text-sm text-[#333333]">Rol: Farmacéutico</p>
</div>
</div>
</div>
</div>
</div>
</body></html>
